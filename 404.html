<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>meatbag — lost?</title>
<meta name="theme-color" content="#050609">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#050609;color:#f2f5f8;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.aura{position:fixed;inset:-25%;background:radial-gradient(40% 40% at 30% 30%,rgba(60,226,143,.2),transparent 62%),radial-gradient(40% 40% at 70% 70%,rgba(84,120,255,.16),transparent 62%);filter:blur(70px);animation:d 18s ease-in-out infinite alternate}
@keyframes d{to{transform:translate3d(4%,-3%,0) scale(1.12)}}
.w{position:relative;z-index:2;padding:24px}
h1{font-size:clamp(64px,20vw,150px);line-height:.9;letter-spacing:-.04em;font-weight:800;
 background:linear-gradient(180deg,#fff,#7d8794);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin-top:16px;color:#8e98a6;font-size:15px}
a{display:inline-block;margin-top:28px;padding:14px 26px;border-radius:999px;background:#3ce28f;color:#04170e;
 text-decoration:none;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.04em;transition:transform .2s}
a:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div class="aura"></div>
<div class="w">
 <h1>404</h1>
 <p>this page is meat. the real one is one tap away.</p>
 <a href="/">back to meatbag.best</a>
</div>
</body>
</html>
